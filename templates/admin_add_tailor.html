{% extends "base.html" %}

{% block title %}Add Tailor{% endblock %}

{% block content %}
<h1>Manage Tailors</h1>
<h2>Add New Tailor</h2>

<form method="POST" action="/admin_add_tailor/" class="card">
    {% csrf_token %}
    <div class="form-grid">
        <div class="field full">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter name" required>
        </div>
        <div class="field">
            <label for="phone">Phone</label>
            <input type="number" id="phone" name="phone" placeholder="Enter phone" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email" required>
        </div>
        <div class="field">
            <label for="place">Place</label>
            <input type="text" id="place" name="place" placeholder="Enter place" required>
        </div>
        <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter age" required>
        </div>
        <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="field">
            <label for="uname">Username</label>
            <input type="text" id="uname" name="uname" placeholder="Enter username" required>
        </div>
        <div class="field full">
            <label for="pswd">Password</label>
            <input type="password" id="pswd" name="pswd" placeholder="Enter password" minlength="6" required>
        </div>
    </div>

    <div class="actions">
        <a href="/admin_manage_tailor/" class="btn ghost">Cancel</a>
        <button type="submit" class="btn">Add Tailor</button>
    </div>
</form>
{% endblock %}
