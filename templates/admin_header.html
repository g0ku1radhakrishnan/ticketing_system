{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Document</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            color-scheme: light;
            --bg: #FCF8F6;
            --surface: #FFFFFF;
            --ink: #1F1626;
            --muted: #756B7A;
            --line: #EEE5E8;
            --brand: #5B2145;
            --brand-ink: #FFFFFF;
            --track: #EFE9EB;
            --c-total: #DFE7FB;   --c-total-ink: #2C4A8F;
            --c-pending: #FDEBC8; --c-pending-ink: #8A5A00;
            --c-urgent: #FBD9DC;  --c-urgent-ink: #B3262F;
            --c-done: #D5EFD9;    --c-done-ink: #1E6B3C;
            --bar-done: #3E9B5F;
            --bar-pending: #F2B13F;
            --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 15px/1.5 var(--font);
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky; top: 0; z-index: 20;
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
        .icon-btn {
            width: 40px; height: 40px; border: 0; background: none;
            display: grid; place-items: center; font-size: 20px; border-radius: 12px;
        }
        .icon-btn:hover { background: var(--line); }
        .brand { font-weight: 700; font-size: 19px; color: var(--brand); letter-spacing: .01em; }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--brand); color: var(--brand-ink);
            display: grid; place-items: center; font-size: 15px;
        }

        /* ---------- Sidebar drawer ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 40;
            background: rgba(20, 8, 24, .5);
            opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
        }
        .sidebar {
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
            width: min(300px, 84vw);
            display: flex; flex-direction: column; gap: 8px;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px));
            background: var(--surface);
            border-right: 1px solid var(--line);
            transform: translateX(-102%); transition: transform .28s ease;
            overflow-y: auto;
        }
        body.menu-open .sidebar { transform: none; }
        body.menu-open .overlay { opacity: 1; visibility: visible; }
        .side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .side-head .brand { font-size: 22px; }
        .side-note { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 8px 4px; }
        .side-btn {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-radius: 14px;
            background: var(--bg); border: 1px solid var(--line);
            font-weight: 600; transition: background .15s, color .15s, border-color .15s;
        }
        .side-btn i { width: 20px; text-align: center; color: var(--brand); }
        .side-btn span { text-transform: lowercase; display: block; }
        .side-btn span::first-letter { text-transform: uppercase; }
        .side-btn:hover { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
        .side-btn:hover i { color: inherit; }

        /* ---------- Main ---------- */
        main { max-width: 640px; margin: 0 auto; padding: 22px 18px calc(110px + env(safe-area-inset-bottom, 0px)); }
        h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; }
        .sub { margin: 4px 0 18px; color: var(--muted); }

        /* Search */
        .search-bar form { display: flex; }
        .search-bar input[type="text"] {
            flex: 1; min-width: 0; padding: 13px 18px; font: inherit; color: var(--ink);
            background: var(--surface); border: 1px solid var(--line); border-right: 0;
            border-radius: 999px 0 0 999px; outline: none;
        }
        .search-bar input::placeholder { color: var(--muted); }
        .search-bar input[type="text"]:focus { border-color: var(--brand); }
        .search-bar button {
            padding: 13px 20px; border: 0; font-weight: 600; white-space: nowrap;
            background: var(--brand); color: var(--brand-ink); border-radius: 0 999px 999px 0;
        }

        /* Stat cards */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0 26px; }
        .stat-card {
            height: 100%; padding: 18px 16px; border-radius: 18px;
            background: var(--bg-c); color: var(--ink-c);
            transition: transform .15s;
        }
        .stats a:hover .stat-card { transform: translateY(-3px); }
        .stat-card .number { font-size: 34px; line-height: 1; font-weight: 700; }
        .stat-card h3 { margin: 8px 0 0; font-size: 14px; font-weight: 500; }
        .t-total   { --bg-c: var(--c-total);   --ink-c: var(--c-total-ink); }
        .t-pending { --bg-c: var(--c-pending); --ink-c: var(--c-pending-ink); }
        .t-urgent  { --bg-c: var(--c-urgent);  --ink-c: var(--c-urgent-ink); }
        .t-done    { --bg-c: var(--c-done);    --ink-c: var(--c-done-ink); }

        /* Section titles + progress */
        h2.section { font-size: 17px; font-weight: 700; margin: 0 0 14px; }
        .progress-block { margin-bottom: 26px; }
        .bar-row { margin-bottom: 14px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
        .bar-label b { font-weight: 700; }
        .track { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
        .fill { height: 100%; border-radius: 999px; }
        .fill.done { background: var(--bar-done); }
        .fill.pending { background: var(--bar-pending); }

        /* Urgent panel */
        .panel {
            padding: 18px; border-radius: 18px; background: var(--surface);
            border: 1px solid var(--line); border-left: 5px solid var(--c-urgent-ink);
        }
        .panel h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--c-urgent-ink); }
        .ticket-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .status-pill {
            display: inline-block; padding: 8px 14px; font-size: .9rem; font-weight: 600;
            background: var(--c-urgent); color: var(--c-urgent-ink);
            border: 1px solid var(--c-urgent-ink); border-radius: 999px;
        }
        .empty-note { color: var(--muted); font-size: .9rem; }

        /* ---------- Bottom nav (phones) ---------- */
        .bottom-nav {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: grid; grid-template-columns: repeat(4, 1fr);
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--surface); border-top: 1px solid var(--line);
        }
        .bottom-nav a, .bottom-nav button {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 6px 4px; background: none; border: 0; border-radius: 12px;
            font-size: 12px; font-weight: 500; color: var(--muted);
        }
        .bottom-nav i { font-size: 20px; }
        .bottom-nav .active { color: var(--brand); font-weight: 700; }

        /* ---------- Tablet / desktop: permanent sidebar ---------- */
        @media (min-width: 900px) {
            .sidebar { transform: none; width: 270px; }
            .overlay, .bottom-nav, #openMenu, #closeMenu { display: none; }
            .topbar { margin-left: 270px; }
            main { margin-left: 270px; max-width: none; padding: 32px clamp(24px, 4vw, 56px) 48px; }
            main > * { max-width: 760px; }
            h1 { font-size: 34px; }
            .stats { grid-template-columns: repeat(4, 1fr); }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body id="top">

    <header class="topbar">
        <button class="icon-btn" id="openMenu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><i class="fa-solid fa-bars"></i></button>

        <span class="avatar" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
    </header>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="Admin menu">
