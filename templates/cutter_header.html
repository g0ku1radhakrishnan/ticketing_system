<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ page_title|default:"Thread Flow" }}</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            color-scheme: light;
            --bg: #FCF8F6; --surface: #FFFFFF; --ink: #1F1626; --muted: #756B7A; --line: #EEE5E8;
            --brand: #5B2145; --brand-ink: #FFFFFF; --track: #EFE9EB;
            --c-total: #DFE7FB;   --c-total-ink: #2C4A8F;
            --c-pending: #FDEBC8; --c-pending-ink: #8A5A00;
            --c-urgent: #FBD9DC;  --c-urgent-ink: #B3262F;
            --c-done: #D5EFD9;    --c-done-ink: #1E6B3C;
            --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

        /* Top bar */
        .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
        .icon-btn { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; font-size: 20px; border-radius: 12px; }
        .icon-btn:hover { background: var(--line); }
        .brand { font-weight: 700; font-size: 19px; color: var(--brand); letter-spacing: .01em; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 15px; }

        /* Sidebar */
        .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(20,8,24,.5); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
        .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; width: min(300px, 84vw); display: flex; flex-direction: column; gap: 8px;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px));
            background: var(--surface); border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .28s ease; overflow-y: auto; }
        body.menu-open .sidebar { transform: none; }
        body.menu-open .overlay { opacity: 1; visibility: visible; }
        .side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .side-head .brand { font-size: 22px; }
        .side-nav { display: flex; flex-direction: column; gap: 8px; }
        .side-btn { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--bg);
            border: 1px solid var(--line); font-weight: 600; transition: background .15s, color .15s, border-color .15s; }
        .side-btn i { width: 20px; text-align: center; color: var(--brand); }
        .side-btn:hover, .side-btn.active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
        .side-btn:hover i, .side-btn.active i { color: inherit; }
        .side-btn.logout { margin-top: auto; background: transparent; color: var(--c-urgent-ink); border-color: var(--c-urgent-ink); }
        .side-btn.logout i { color: inherit; }
        .side-btn.logout:hover { background: var(--c-urgent); color: var(--c-urgent-ink); border-color: var(--c-urgent-ink); }

        /* Page area */
        main { max-width: 640px; margin: 0 auto; padding: 22px 18px calc(110px + env(safe-area-inset-bottom, 0px)); }
        main h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; word-break: break-word; }
        .sub { margin: 6px 0 18px; color: var(--muted); }

        /* Bottom nav */
        .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
        .bottom-nav a, .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px;
            background: none; border: 0; border-radius: 12px; font-size: 12px; font-weight: 500; color: var(--muted); }
        .bottom-nav i { font-size: 20px; }
        .bottom-nav .active { color: var(--brand); font-weight: 700; }

        /* Desktop: permanent sidebar */
        @media (min-width: 900px) {
            .sidebar { transform: none; width: 270px; }
            .overlay, .bottom-nav, #openMenu, #closeMenu { display: none; }
            .topbar { margin-left: 270px; }
            main { margin-left: 270px; max-width: none; padding: 32px clamp(24px, 4vw, 56px) 48px; }
            main > * { max-width: 760px; }
            main h1 { font-size: 34px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body id="top">

    <header class="topbar">
        <button class="icon-btn" id="openMenu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><i class="fa-solid fa-bars"></i></button>
        <span class="brand">Thread Flow</span>
        <span class="avatar" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
    </header>

    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Cutter menu">
        <div class="side-head">
            <span class="brand">Thread Flow</span>
            <button class="icon-btn" id="closeMenu" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <nav class="side-nav">
            <!-- TO ADD A NEW OPTION LATER: copy one line below, then change the link, icon and text -->
                         <a class="side-btn {% if '/cutter_home' in request.path %}active{% endif %}" href="/cutter_tailorapp/cutter_home"><i class="fa-solid fa-house"></i><span>Home  </span></a>

            <a class="side-btn {% if '/cutter_available_jobs' in request.path %}active{% endif %}" href="/cutter_tailorapp/cutter_available_jobs"><i class="fa-solid fa-boxes-stacked"></i><span>View Available Jobs Pool</span></a>
            <a class="side-btn {% if '/cutter_my_jobs' in request.path %}active{% endif %}" href="/cutter_tailorapp/cutter_my_jobs/"><i class="fa-solid fa-list-check"></i><span>View My Claimed Jobs</span></a>
            <a class="side-btn {% if '/cutter_completed_jobs' in request.path %}active{% endif %}" href="/cutter_tailorapp/cutter_completed_jobs/"><i class="fa-solid fa-circle-check"></i><span>View Completed Jobs</span></a>
        </nav>

        <a class="side-btn logout" href="/"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </aside>
